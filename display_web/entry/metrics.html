<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPU 与 FPGA 评测对比</title>
<style>*{box-sizing:border-box}body{font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:#203343;background:#f4f7fa;margin:0;padding:20px}h1{font-size:23px;margin:0 0 10px}p{margin:8px 0}select,button{font:inherit;padding:7px 12px;border:1px solid #b6c9d6;background:white;border-radius:6px}small,.hint{color:#617787}#notice{color:#8a4c13}article{background:white;border:1px solid #dce4eb;border-radius:8px;padding:16px;margin-top:14px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:580px}td,th{border-bottom:1px solid #dce4eb;text-align:left;padding:9px 10px;vertical-align:top}th{background:#eef5f7}td:first-child{width:43%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace}#scope{overflow-wrap:anywhere;white-space:pre-line}label{display:inline-block;margin-right:16px}[hidden]{display:none!important}</style></head>
<body><h1>CPU / 软件基线与 FPGA 对比</h1><p class="hint">展示已记录的配对评测，当前保存任务的计时仍显示在原状态栏。HDMI 触摸状态栏可打开同一份指标。</p>
<label>评测记录 <select id="record" aria-label="选择模型和评测版本"></select></label><button id="refresh">刷新资料</button><p id="notice" role="status"></p><p id="scope" class="hint"></p>
<article><table><thead><tr><th>指标与统计范围</th><th>CPU / 软件基线</th><th>FPGA</th></tr></thead><tbody id="metrics"></tbody></table></article>
<p id="methods" class="hint"></p><p id="accuracy" class="hint"></p><p id="agreement" class="hint"></p>
<details><summary>报告来源与版本</summary><pre id="sources"></pre></details><p class="hint">LUT/FF/BRAM/DSP 为静态构建占用；DMA 包估算不包含全部 DDR 访问。未提供证据的项显示“未测量”，软件后端无 FPGA 资源占用，显示“不适用”。工程教学与算法演示，不作为临床诊断依据。</p>
<script>
'use strict';const $=id=>document.getElementById(id);let records=[];
const definitions=[['处理帧率（累计处理时间）',['processing_fps'],'帧/s'],['单帧/切片延迟（中位数 / P95）',['median_ms','p95_ms'],'ms'],['吞吐率（完整测量循环墙钟）',['throughput_fps'],'帧/s'],['有效计算吞吐率（网络口径，含 DMA）',['gmac_s'],'GMAC/s'],['功耗（口径见下方）',['power_w'],'W'],['LUT / FF 占用',['lut','ff'],''],['BRAM36 等效 / DSP 占用',['bram','dsp'],''],['DDR 相关流量（DMA 包估算）',['ddr_MB_s'],'MB/s'],['算法精度（同 GT，逐图均值 Dice / IoU）',['dice','iou'],''],['算法精度变化（候选减基线 Dice / IoU）',['dice_delta_pp','iou_delta_pp'],'百分点']];
function show(){const r=records[Number($('record').value)]||null;$('metrics').replaceChildren();for(const [label,fields,unit]of definitions){const tr=document.createElement('tr');const name=document.createElement('td');name.textContent=label+(unit?' · '+(r?.model==='acdc'&&unit==='帧/s'?'切片/s':unit):'');tr.append(name);for(const backend of ['cpu','fpga']){const td=document.createElement('td');td.textContent=backend==='cpu'&&['lut','bram'].includes(fields[0])?'不适用（软件）':fields.map(k=>{const v=r?.[backend]?.metrics?.[k];if(typeof v!=='number'||!Number.isFinite(v))return '未测量';if(['lut','ff','bram','dsp'].includes(k)){const pct=r[backend].resource_percent?.[k];return String(v)+(typeof pct==='number'?' ('+pct.toFixed(1)+'%)':'');}return v.toFixed(['dice','iou'].includes(k)?4:2);}).join(' / ');tr.append(td);}$('metrics').append(tr);}
$('notice').textContent=r?(r.synthetic?'合成测试资料，仅用于检查界面，不能作为性能或医学精度成绩。':'已记录的评测资料；不表示此刻正在运行的实时性能。'):'尚未导入匹配的 CPU / FPGA 评测资料。';$('scope').textContent=r?'模型 '+r.model+' · CPU N='+r.cpu.frames+' / FPGA N='+r.fpga.frames+' · '+r.label_scope+'\nCPU：'+r.cpu.baseline+' · '+r.cpu.platform+'\nFPGA：'+r.fpga.platform:'';
$('methods').textContent=r?'功耗口径：CPU '+r.cpu.power_method+'；FPGA '+r.fpga.power_method+'。不同测量边界不能直接计算能效比。处理帧率按累计处理时间计算；完整循环吞吐含工具和输出开销。':'单张静态任务的延迟倒数不会作为实时帧率填入本表。';$('accuracy').textContent=r?'精度范围：'+r.accuracy_scope:'算法精度需配对真实标注。输出一致不等于 Dice / IoU 已测。';$('agreement').textContent=r?(r.checks.integer_head_all_exact?'整数网络输出逐元素一致。':'未建立整数网络输出完全一致。')+(r.checks.inference_acceleration_cpu_int8_over_pl?' 同板 NumPy INT8 参考耗时比：'+r.checks.inference_acceleration_cpu_int8_over_pl.toFixed(2)+' 倍（不代表优化 CPU 基线）。':' 未生成自动 FPGA 加速比。'):'';$('sources').textContent=r?JSON.stringify({模型SHA:r.model_sha256,运行时SHA:r.runtime_sha256,数据集SHA:r.dataset_sha256,内容SHA:r.record_sha256,统计检查:r.checks,报告来源:r.sources},null,2):'没有报告。';}
async function refresh(){try{const response=await fetch('/entry/metrics',{cache:'no-store'});if(!response.ok)throw Error('评测资料读取失败');const data=await response.json();records=data.records||[];const previous=$('record').value;$('record').replaceChildren();records.forEach((r,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=r.model+' · 模型 '+r.model_sha256.slice(0,8)+' / 运行时 '+r.runtime_sha256.slice(0,8);$('record').append(option);});if(!records.length){const o=document.createElement('option');o.value='';o.textContent='待导入评测';$('record').append(o);}else $('record').value=previous!==''&&records[Number(previous)]?previous:'0';show();if(data.status==='invalid_evidence')$('notice').textContent='评测资料校验失败，已隐藏其中的数值。';}catch(e){records=[];show();$('notice').textContent=e.message;}}
$('record').onchange=show;$('refresh').onclick=refresh;refresh();
</script></body></html>
