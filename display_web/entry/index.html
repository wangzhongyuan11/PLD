<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLD · 统一入口</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#203343;font:15px system-ui,"Microsoft YaHei",sans-serif}header{background:white;border-bottom:1px solid #dce4eb;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}strong{font-size:21px}.buttons{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;padding:10px 20px;border:1px solid #b6c9d6;background:white;color:#24475e;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#176a84;border-color:#176a84;color:white}button:disabled{opacity:.5;cursor:wait}#status{margin:0;padding:10px 24px;font-size:14px}#error{color:#a52b2b;padding:0 24px;white-space:pre-wrap}iframe{display:block;width:100%;height:calc(100vh - 114px);border:0;background:#f4f7fa}[hidden]{display:none!important}small{color:#64798a}
body{display:flex;flex-direction:column;height:100vh}#workspace{flex:1;min-height:360px;height:auto}
</style></head><body>
<header><strong>PLD 统一入口</strong><div class="buttons"><button id="acdc" disabled aria-pressed="true">心脏 2.5D</button><button id="skin" disabled aria-pressed="false">皮肤镜</button><button id="camus" disabled aria-pressed="false">CAMUS</button><button id="interactive" hidden disabled aria-pressed="false">ROI / 交互分割</button></div><label><input id="autoHdmi" type="checkbox"> 自动显示 HDMI</label><label><input id="autoSegment" type="checkbox"> 选图后自动分割</label><small>切换前请下载需要保留的结果</small></header>
<p id="status" role="status" aria-live="polite">正在准备三模型演示…</p><p id="error" role="alert" hidden></p>
<div style="padding:0 24px 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button id="recoveryDemo" disabled>超时恢复演示（模拟）</button><small>工程教学与算法演示，不作为临床诊断依据</small></div>
<dialog id="errorDialog" aria-labelledby="errorTitle" style="max-width:560px;border:1px solid #dce4eb;border-radius:10px;padding:24px"><h2 id="errorTitle">操作未完成</h2><p id="errorDetail" style="white-space:pre-wrap;overflow-wrap:anywhere"></p><p id="errorHelp">请检查当前任务状态及服务日志，再按部署说明恢复。</p><button id="closeError">知道了</button></dialog>
<dialog id="demoDialog" aria-labelledby="demoTitle" style="width:680px;max-width:92vw;border:1px solid #dce4eb;border-radius:10px;padding:24px"><h2 id="demoTitle">超时看门狗与恢复流程演示</h2><p>本演示使用软件模拟设备，展示超时、复位、重新映射、一次重试及输出校验。不操作真实 FPGA、DMA、位流或分割任务。</p><div class="buttons"><button id="demoRecover">演示超时后恢复</button><button id="demoFail">演示恢复失败</button><button id="closeDemo">关闭</button></div><p id="demoStatus" role="status" aria-live="polite">尚未开始</p><pre id="demoLog" style="white-space:pre-wrap;max-height:280px;overflow:auto;font:14px/1.7 system-ui"></pre><small>真实硬件恢复需单独板测；关闭窗口后，已开始的模拟流程仍会有界结束。</small></dialog>
<iframe id="workspace" title="模型操作界面" style="flex:1;min-height:360px;height:auto" hidden></iframe>
<script>
'use strict';
const $=id=>document.getElementById(id),names={acdc:'心脏 2.5D',skin:'皮肤镜',camus:'CAMUS'};
let frame='',pending=false,interactive=false,last=null,activeErrorKey='';
function openDialog(id){const d=$(id);if(typeof d.showModal==='function'){if(!d.open)d.showModal();}else d.setAttribute('open','');}
function closeDialog(id){const d=$(id);if(typeof d.close==='function')d.close();else d.removeAttribute?.('open');}
function presentError(message,key=message,simulated=false){$('error').hidden=!message;$('error').textContent=message;if(!message){activeErrorKey='';return;}if(key!==activeErrorKey){activeErrorKey=key;$('errorDetail').textContent=message;$('errorTitle').textContent=simulated?'模拟恢复未通过':'操作未完成';$('errorHelp').textContent=simulated?'这是模拟场景的预期失败。可关闭提示后重新运行模拟流程。':'请检查当前任务状态及服务日志，再按部署说明恢复。';openDialog('errorDialog');}}
function renderDemo(d,ready){const running=d?.state==='running';$('recoveryDemo').disabled=!ready;$('demoRecover').disabled=!ready||running;$('demoFail').disabled=!ready||running;const labels={idle:'尚未开始',running:'模拟流程进行中',done:'模拟恢复与输出校验通过',failed:'模拟恢复失败，已停止重试',cancelled:'模拟演示已取消'};$('demoStatus').textContent=labels[d?.state]||'尚未开始';$('demoLog').textContent=(d?.events||[]).map(e=>'[模拟]['+e.code+'] '+e.elapsed_seconds.toFixed(2)+'s · '+e.message).join('\n');}
function sendPreferences(){const view=$('workspace');if(view.contentWindow&&frame&&last?.settings)view.contentWindow.postMessage({type:'pld-preferences',settings:last.settings},new URL(frame,location.href).origin);}
if(typeof window!=='undefined')window.addEventListener('message',e=>{const view=$('workspace');if(e.source===view.contentWindow&&e.data?.type==='pld-preferences-request')sendPreferences();});
async function api(path,body){const r=await fetch(path,{cache:'no-store',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const s=await r.json();if(!r.ok)throw Error(s.error||'服务连接失败');return s;}
function statusText(s){
 if(s.boot?.state==='running'){
  const target=names[s.boot.target]||'模型',last=names[s.boot.default_model]||'默认模型';
  const action=s.boot.completed.includes(s.boot.target)?'正在恢复默认模型':'正在准备';
  return '开机准备 '+s.boot.completed.length+'/3 · '+action+target+'，完成后进入'+last+'，请稍候…';
 }
 if(s.phase==='ready')return (s.boot?.state==='ready'?'演示准备完成 · ':'')+names[s.model]+'已就绪'+(s.display?.restored?' · HDMI 自动恢复上次结果':'')+(interactive?' · ROI / 点提示 / 框提示':'');
 if(s.phase==='error')return s.boot?.state==='error'?'开机准备未完成':'切换未完成';
 return (({wait_current_task:'等待当前任务',release_previous_model:'释放当前模型与显示',start_target:'启动目标模型',initialize_target:'初始化目标模型'})[s.stage]||'正在初始化')+' · '+(names[s.target]||'模型')+'，请稍候…';
}
function render(s){const preferencesChanged=JSON.stringify(last?.settings)!==JSON.stringify(s.settings);const ready=s.phase==='ready'&&s.boot?.state!=='running';if(!ready||!last||last.model!==s.model)interactive=false;last=s;if(s.settings){$('autoHdmi').checked=s.settings.auto_hdmi;$('autoSegment').checked=s.settings.auto_segment;}for(const key of Object.keys(names)){$(key).disabled=!ready;$(key).setAttribute('aria-pressed',String(ready?s.model===key:s.target===key));}const dual=ready&&s.model==='skin';$('interactive').hidden=!dual;$('interactive').disabled=!dual;$('interactive').setAttribute('aria-pressed',String(interactive));$('interactive').textContent=interactive?'返回普通分割':'ROI / 交互分割';$('status').textContent=statusText(s);const error=s.error||s.display?.error||s.recovery_demo?.error||'';const simulated=Boolean(error&&s.recovery_demo?.error===error);presentError(error,error+(simulated?s.recovery_demo.run_id:''),simulated);renderDemo(s.recovery_demo,ready);const url=ready?(s.url.startsWith('/')?s.url+(interactive?'interactive':''):'http://'+location.hostname+':'+s.url):'';if(url!==frame){frame=url;const view=document.createElement('iframe');view.id='workspace';view.title='模型操作界面';view.hidden=!url;view.onload=sendPreferences;view.src=url||'about:blank';$('workspace').replaceWith(view);}if(preferencesChanged)sendPreferences();}
$('interactive').onclick=()=>{if(last&&last.phase==='ready'&&last.model==='skin'){interactive=!interactive;render(last);}};
async function refresh(){if(pending)return;pending=true;try{render(await api('/entry/status'));}catch(e){$('status').textContent='入口连接中断';presentError(e.message);for(const key of Object.keys(names))$(key).disabled=true;renderDemo(last?.recovery_demo,false);}finally{pending=false;}}
for(const model of Object.keys(names))$(model).onclick=async()=>{for(const key of Object.keys(names))$(key).disabled=true;try{render(await api('/entry/switch',{model}));}catch(e){presentError(e.message);}};
for(const [id,key]of [['autoHdmi','auto_hdmi'],['autoSegment','auto_segment']])$(id).onchange=async()=>{try{await api('/entry/settings',{[key]:$(id).checked});await refresh();sendPreferences();}catch(e){presentError(e.message);}};
$('recoveryDemo').onclick=()=>openDialog('demoDialog');$('closeDemo').onclick=()=>closeDialog('demoDialog');$('closeError').onclick=()=>closeDialog('errorDialog');
for(const [id,scenario]of [['demoRecover','recover'],['demoFail','recovery_failure']])$(id).onclick=async()=>{try{render(await api('/entry/recovery-demo',{scenario}));}catch(e){presentError(e.message);}};
let idleTicks=0;refresh();setInterval(()=>{if(last?.phase!=='ready'||last?.recovery_demo?.state==='running'||++idleTicks%6===0)refresh();},250);
</script></body></html>
