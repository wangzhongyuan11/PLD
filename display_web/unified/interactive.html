<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交互分割工作台</title>
<style>body{margin:0;background:#f1f6f8;color:#123040;font:16px system-ui}main{max-width:1250px;margin:auto;padding:24px}.bar,.panel{background:white;border:1px solid #d2e0e5;border-radius:12px;padding:18px;margin-bottom:16px}button,select,input{padding:9px;margin:4px;border:1px solid #abc2cb;border-radius:6px}button{cursor:pointer;background:#fff}button.primary{background:#007983;color:white}button:disabled{opacity:.5}#grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}canvas,img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#10212b;border-radius:8px}canvas{touch-action:none}figcaption{padding:8px}#message{white-space:pre-wrap;color:#965021}pre{white-space:pre-wrap}.hint{font-size:14px;color:#536e7d}.row{display:flex;flex-wrap:wrap;align-items:center}a{color:#007983}</style>
<main><div class="bar"><a href="/">返回原四宫格工作台 / 切换模型</a><h1>ROI · 点提示 · 框提示</h1><p id="model">正在读取当前模型…</p><p class="hint">ROI 裁剪后由 FPGA 推理；点与框通过 PS/CPU 图割修正。模型未经过提示式训练。仅用于工程教学与算法演示，不作为临床诊断依据。</p></div>
<div class="panel"><div class="row"><input id="file" type="file" accept="image/png,image/jpeg"><select id="tool"><option value="foreground">前景点（保留）</option><option value="background">背景点（排除）</option><option value="roi">ROI 裁剪区域</option><option value="box">目标框</option></select><select id="target"><option value="1">皮肤病灶</option></select><button id="undo">撤销</button><button id="clear">清除所有提示</button></div><div class="row"><label><input id="custom" type="checkbox">自定义概率阈值</label><input id="threshold" type="number" min="0.01" max="0.99" step="0.01" value="0.45"><button id="run" class="primary" disabled>运行 / 更新分割</button></div><p class="hint">原图上单击放点，拖动绘制 ROI 或框；ROI 更新会清空旧点和框。图片长边自动限制为1024像素，坐标与面积均以页面处理图为准。每次修改后点击“运行”。本页使用 JPG/PNG。</p><div id="message" role="status"></div></div>
<div id="grid" class="panel"><figure><figcaption>① 原图与交互提示</figcaption><canvas id="source" width="640" height="480"></canvas></figure><figure><figcaption>② 仅显示增强</figcaption><img id="enhanced" alt="增强预览"></figure><figure><figcaption>③ 所选结构掩膜</figcaption><img id="mask" alt="目标掩膜"></figure><figure><figcaption>④ 交互分割叠加</figcaption><img id="overlay" alt="分割叠加"></figure></div>
<div class="panel"><pre id="stats">尚未处理</pre><button id="download" disabled>下载交互结果（JSON，内含PNG）</button><button id="maskDownload" disabled>下载目标掩膜 PNG</button><p class="hint">交互结果在此页独立下载。普通分割页的历史、结果包和 HDMI 显示仍对应原始推理结果，不代表这里的交互修正。</p></div></main><script src="/interactive.js"></script></html>
